services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brokerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456@Aa
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brokerdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: django-insecure-docker-development-key
      DB_NAME: brokerdb
      DB_USER: postgres
      DB_PASSWORD: 123456@Aa
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data: